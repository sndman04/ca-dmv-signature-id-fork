name: CI

on:
  push:
  pull_request:

jobs:
  swift:
    name: Swift package
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install reference SDK dependencies
        working-directory: References/cadmv-dlid-verifier-sdk
        run: pnpm install --frozen-lockfile

      - name: Build debug
        run: swift build

      - name: Build release
        run: swift build -c release

      - name: Run SwiftPM tests
        run: Tools/swift-test.sh

      - name: Run official-fixture self-test
        run: swift run CADMVVerifierSelfTest

      - name: Report parity status
        run: Tools/parity-status.sh

      - name: Reference oracle smoke
        run: Tools/reference-oracle-smoke.sh

      - name: Final release audit
        run: Tools/final-release-audit.sh
